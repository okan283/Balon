name: Sözlüğü oluştur

# Wiktionary / Vikisözlük verisinden İngilizce -> Türkçe sözlüğü üretip dict/en-tr klasörüne kaydeder.
# Elle çalıştırmak için: Actions -> Sözlüğü oluştur -> Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_dict.py
      - .github/workflows/dict.yml
  schedule:
    - cron: "17 3 1 * *" # her ayın 1'inde güncelle

permissions:
  contents: write

concurrency:
  group: dict
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verileri indir
        run: |
          set -uo pipefail
          mkdir -p /tmp/w
          # get <hedef> <adres...>: ilk ulaşılabilen adresi indirir
          get() {
            local out="$1"; shift
            for u in "$@"; do
              if curl -fsSL --retry 3 --max-time 1800 -o "$out" "$u"; then echo "İndirildi: $u ($(du -h "$out" | cut -f1))"; echo "$u" >> /tmp/w/sources; return 0; fi
              echo "Ulaşılamadı: $u"
            done
            rm -f "$out"; return 1
          }
          get /tmp/w/en.jsonl.gz \
            https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl.gz || exit 1
          get /tmp/w/tr.jsonl.gz \
            https://kaikki.org/dictionary/Turkish/kaikki.org-dictionary-Turkish.jsonl.gz || echo "Türkçe kelimeler atlandı"
          get /tmp/w/trwikt.jsonl.gz \
            https://kaikki.org/trwiktionary/raw-wiktextract-data.jsonl.gz \
            https://kaikki.org/dictionary/downloads/tr/tr-extract.jsonl.gz || echo "Türkçe Vikisözlük atlandı"

      - name: Sözlüğü üret
        run: |
          set -euo pipefail
          python3 tools/build_dict.py dict/en-tr \
            --en /tmp/w/en.jsonl.gz --tr /tmp/w/tr.jsonl.gz --trwikt /tmp/w/trwikt.jsonl.gz \
            --sources "$(paste -sd ' ' /tmp/w/sources)" \
            --show "consider,acknowledge,acknowledged,possession,run,set,glance,summon,rightful,however"
          echo "Dosya sayısı: $(ls dict/en-tr | wc -l)"
          du -sh dict/en-tr

      - name: Değiştiyse kaydet
        run: |
          set -euo pipefail
          git config user.name "okan283"
          git config user.email "okan283@users.noreply.github.com"
          git add dict
          if git diff --cached --quiet; then echo "Sözlük değişmedi"; exit 0; fi
          git commit -q -m "Sözlük: Wiktionary verisinden yeniden oluşturuldu"
          git pull -q --rebase origin main
          git push
